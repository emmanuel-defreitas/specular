# Ships a tagged version to npm and attaches the tarball to the GitHub
# Release.
#
# Tag-driven. The version was chosen when next.yml cut release/vX.Y.Z and
# wrote it into package.json; release.yml turned that into the tag.
#
# Publishes with provenance. Needs `NPM_TOKEN` (an automation token for the
# @exegia scope) — or switch to npm trusted publishing and drop the secret.
name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to (re)publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build tarball
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup

      - id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json matches the tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eu
          want="v$(make -s --no-print-directory pkg-version)"
          [ "$want" = "$TAG" ] || { echo "::error::package.json is $want but the tag is $TAG"; exit 1; }

      - run: make ci
      - run: make pack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bezel-${{ steps.meta.outputs.tag }}
          path: dist-pack/
          if-no-files-found: error

  publish:
    name: Publish to npm and attach to release
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5
        with:
          name: bezel-${{ needs.build.outputs.tag }}
          path: dist-pack

      - name: Publish the tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set — add it under Settings → Secrets and variables → Actions"; exit 1
          fi
          npm publish dist-pack/*.tgz --provenance --access public

      - name: Attach the tarball to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release upload "$TAG" dist-pack/* --clobber
